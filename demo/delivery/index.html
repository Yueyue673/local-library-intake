<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地文库收件</title>
<style>
:root {
  color-scheme: light;
  --paper: #f7f5ef;
  --ink: #243d34;
  --muted: #61746a;
  --line: #dce2d7;
  --green: #315e4b;
  --err: #a03535;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.75 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", "WenQuanYi Micro Hei", "Droid Sans Fallback", system-ui, sans-serif;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 5rem 1.5rem 4.5rem;
}
h1 {
  margin: 0;
  font-size: 1.65rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  line-height: 1.4;
}
.lead {
  margin: 0.85rem 0 2.4rem;
  color: var(--muted);
}
.lead a { white-space: nowrap; }
a {
  color: var(--green);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.22em;
}
a:hover { color: var(--ink); }
a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
table {
  width: max-content;
  max-width: 100%;
  border-collapse: collapse;
  font-size: 1rem;
  line-height: 1.5;
}
th, td { text-align: left; vertical-align: baseline; }
th {
  padding: 0 2.25rem 0.5rem 0;
  border-bottom: 1px solid var(--ink);
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 500;
}
td {
  padding: 0.8rem 2.25rem 0.8rem 0;
  border-bottom: 1px solid var(--line);
}
td:first-child { overflow-wrap: anywhere; max-width: 16rem; }
td:nth-child(2) { white-space: nowrap; }
td:nth-child(3) { overflow-wrap: anywhere; max-width: 16rem; }
th:last-child, td:last-child { padding-right: 0; }
.err { color: var(--err); }
.foot {
  margin: 2.15rem 0 0;
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.7;
}
@media (max-width: 640px) {
  main { padding: 2.5rem 1.15rem 3rem; }
  th, td { padding-right: 1rem; }
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #17231f;
    --ink: #e0e8dc;
    --muted: #b0bfae;
    --line: #3b4b3f;
    --green: #85b59a;
    --err: #ffb8b0;
  }
}
</style>
</head>
<body>
<main>
<h1>原文还在，另外抽出一份能读的文本。</h1>
<p class="lead">离线处理 TXT、Markdown 和 EPUB。原文按字节原样复制。<a href="manifest.json">查看文件哈希和处理结果</a>。</p>
<table>
<thead>
<tr><th>源文件</th><th>结果</th><th>输出</th></tr>
</thead>
<tbody>
    <tr>
      <td>garden.epub</td>
      <td>converted</td>
      <td><a href="text/0001-garden.epub.txt">阅读文本</a></td>
    </tr>
    <tr>
      <td>recipe.md</td>
      <td>converted</td>
      <td><a href="text/0002-recipe.md.txt">阅读文本</a></td>
    </tr>
    <tr>
      <td>workshop.txt</td>
      <td>converted</td>
      <td><a href="text/0003-workshop.txt.txt">阅读文本</a></td>
    </tr>
</tbody>
</table>
<p class="foot">目前不做 PDF、OCR，也不能解开带数字版权保护的文件。Markdown 仍按文本留下。不联网，也不额外装包。</p>
</main>
</body>
</html>
